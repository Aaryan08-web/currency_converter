<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Currency Converter</h1>

        <form id="converterForm" novalidate>
            <label for="amount" class="amount">Amount</label>
            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="Enter amount"
                inputmode="decimal"
                step="any"
                min="0"
                autocomplete="off"
                aria-describedby="amountError"
                required
            >
            <p id="amountError" class="field-error" role="alert" aria-live="polite"></p>

            <div class="currency-select">
                <div class="form-label">
                    <label for="from">From</label>
                    <div>
                        <img id="fromFlag" src="" width="32" height="32" alt="" class="flag-img">
                        <select id="from" name="from"></select>
                    </div>
                </div>

                <button type="button" id="swapBtn" class="swap-btn" aria-label="Swap from and to currencies">
                    <i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i>
                </button>

                <div class="to-label">
                    <label for="to">To</label>
                    <div>
                        <img id="toFlag" src="" width="32" height="32" alt="" class="flag-img">
                        <select id="to" name="to"></select>
                    </div>
                </div>
            </div>

            <button type="submit" id="convert">
                <span class="btn-label">Convert</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>
        </form>

        <div id="result" role="status" aria-live="polite"></div>

        <p class="attribution">
            Rates by <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">Exchange Rate API</a>
        </p>
    </div>

    <script src="currencies.js"></script>
    <script src="script.js"></script>

</body>
</html>
